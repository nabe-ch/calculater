<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater.App</title>
    <link rel="stylesheet" href="stylesheet.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- 表示画面 -->
     <h1>ー　電卓　ー</h1>
    <input type="text" class="monitor" value="0" disabled>
    <!-- <p>※演算子を式の最後にしないこと※</p> -->
    <!-- キーボード -->
    <div class="keyBoad">
        <!-- 計算ボタン -->
        <div >
            <ul class="calculation">
                <li class="calculationButton"><button class="plus" value="+">+</button></li>
                <li class="calculationButton"><button class="minus" value="-">－</button></li>
                <li class="calculationButton"><button class="multi" value="*">×</button></li>
                <li class="calculationButton"><button class="division" value="/">÷</button></li>
            </ul> 
        </div>

        <!-- ナンバーキー -->
        <div >
            <ul class="number">
                <li class="numberButton"><button class="nine" value="9">9</button></li>
                <li class="numberButton"><button class="eight" value="8">8</button></li>
                <li class="numberButton"><button class="seven" value="7">7</button></li>
                <li class="numberButton"><button class="six" value="6">6</button></li>
                <li class="numberButton"><button class="five" value="5">5</button></li>
                <li class="numberButton"><button class="four" value="4">4</button></li>
                <li class="numberButton"><button class="three" value="3">3</button></li>
                <li class="numberButton"><button class="two" value="2">2</button></li>
                <li class="numberButton"><button class="one" value="1">1</button></li>
                <li class="numberButton"><button class="point" value=".">.</button></li>
                <li class="numberButton zeroButton"><button class="zero" value="0">0</button></li>
            </ul>
        </div>
        <!--リセット「C」キー -->
        <div class="under">
            <div class="liset">
                <button class="lisetButton">C</button>
            </div>
            <!-- イコールボタン -->
            <div class="equal">
                <button class="equalButton">=</button>
            </div>

            <div class="back">
                <button class="backButton">←</button>
            </div>
        </div>
    </div>
</body> 
</html>
